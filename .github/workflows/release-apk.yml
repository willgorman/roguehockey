name: Build & Publish APK Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (defaults to 'latest')"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run unit tests & assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare versioned APK filename
        id: apk
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="RogueHockey ${TAG}"
            IS_PRERELEASE="false"
            APK_NAME="RogueHockey-${TAG}-debug.apk"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.tag }}" && "${{ inputs.tag }}" != "latest" ]]; then
            TAG="${{ inputs.tag }}"
            TITLE="RogueHockey ${TAG}"
            IS_PRERELEASE="false"
            APK_NAME="RogueHockey-${TAG}-debug.apk"
          else
            TAG="latest"
            TITLE="RogueHockey Latest Build"
            IS_PRERELEASE="true"
            APK_NAME="RogueHockey-debug.apk"
          fi

          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/${APK_NAME}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=release-assets/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.apk.outputs.tag }}"
          TITLE="${{ steps.apk.outputs.title }}"
          APK_PATH="${{ steps.apk.outputs.apk_path }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_PATH}" --clobber
            gh release edit "${TAG}" \
              --title "${TITLE}" \
              --target "${GITHUB_SHA}" \
              --notes "Automated Android tablet APK build from commit \`${SHORT_SHA}\`."
          else
            EXTRA_FLAGS=()
            if [[ "${{ steps.apk.outputs.prerelease }}" == "true" ]]; then
              EXTRA_FLAGS+=(--prerelease)
              NOTES="Automated Android tablet APK build from \`main\` (\`${SHORT_SHA}\`). Download and sideload the APK on an Android tablet."
              gh release create "${TAG}" "${APK_PATH}" \
                --title "${TITLE}" \
                --target "${GITHUB_SHA}" \
                --notes "${NOTES}" \
                "${EXTRA_FLAGS[@]}"
            else
              gh release create "${TAG}" "${APK_PATH}" \
                --title "${TITLE}" \
                --target "${GITHUB_SHA}" \
                --generate-notes
            fi
          fi
